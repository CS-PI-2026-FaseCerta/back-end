spring.config.import=optional:file:.env[.properties]

spring.application.name=backend
server.port=${PORT:8080}

# Configurações do MySQL (porta padrão: 5244)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:5244}/${DB_NAME:fasecerta}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações do Actuator / Endpoint /health
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Autenticação JWT: segredo externo com pelo menos 32 bytes UTF-8; expiração em milissegundos
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Provisionamento inicial do administrador (desabilitado por padrão)
bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}

# Origens do front-end autorizadas a acessar a API
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Limite de tentativas de login por IP da conexão
auth.rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
