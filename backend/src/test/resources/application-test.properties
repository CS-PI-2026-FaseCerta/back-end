jwt.secret=test-secret-key-for-jwt-tests-at-least-32-bytes
jwt.expiration=3600000

spring.datasource.url=jdbc:h2:mem:fasecerta;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
